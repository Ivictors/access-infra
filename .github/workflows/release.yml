name: Release combination

on:
  pull_request:
    paths:
      - compose.release.yaml
      - releases/**
      - scripts/check-stack.py
      - .github/workflows/release.yml
  push:
    branches: [main]
    paths:
      - compose.release.yaml
      - releases/**
      - scripts/check-stack.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: access-infra
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Ivictors/device-simulator
          path: simulator
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require immutable image references
        working-directory: access-infra
        run: |
          grep -Eq '^POSTGRES_IMAGE=.+@sha256:[0-9a-f]{64}$' releases/current.env
          grep -Eq '^GATEWAY_IMAGE=.+@sha256:[0-9a-f]{64}$' releases/current.env
          grep -Eq '^WEB_IMAGE=.+@sha256:[0-9a-f]{64}$' releases/current.env
      - name: Prepare ephemeral test configuration
        run: |
          export ACCESS_WEB_TEST_PASSWORD="$(openssl rand -hex 16)"
          export ACCESS_GATEWAY_ADMIN_TOKEN="$(openssl rand -hex 32)"
          POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          WEB_HASH="$(docker run --rm -e ACCESS_WEB_TEST_PASSWORD php:8.4-cli php -r 'echo password_hash(getenv("ACCESS_WEB_TEST_PASSWORD"), PASSWORD_DEFAULT);')"
          printf "POSTGRES_PASSWORD=%s\nACCESS_GATEWAY_ADMIN_TOKEN=%s\nACCESS_WEB_PASSWORD_HASH='%s'\n" "$POSTGRES_PASSWORD" "$ACCESS_GATEWAY_ADMIN_TOKEN" "$WEB_HASH" > access-infra/.env
          echo "ACCESS_GATEWAY_ADMIN_TOKEN=$ACCESS_GATEWAY_ADMIN_TOKEN" >> "$GITHUB_ENV"
          echo "ACCESS_WEB_TEST_PASSWORD=$ACCESS_WEB_TEST_PASSWORD" >> "$GITHUB_ENV"
      - name: Start pinned images
        working-directory: access-infra
        run: docker compose --env-file .env --env-file releases/current.env -f compose.release.yaml up -d
      - name: Check the end-to-end flow
        working-directory: access-infra
        env:
          SIMULATOR_PATH: ../simulator/main.py
        run: python scripts/check-stack.py
      - name: Stop stack
        if: always()
        working-directory: access-infra
        run: docker compose --env-file .env --env-file releases/current.env -f compose.release.yaml down -v
