name: access-stack

services:
  db:
    image: ${POSTGRES_IMAGE:?Set a PostgreSQL image digest}
    environment:
      POSTGRES_DB: access_gateway
      POSTGRES_USER: access_gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U access_gateway -d access_gateway"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - data

  gateway:
    image: ${GATEWAY_IMAGE:?Set a gateway image digest}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/access_gateway
      SPRING_DATASOURCE_USERNAME: access_gateway
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      ACCESS_GATEWAY_ADMIN_TOKEN: ${ACCESS_GATEWAY_ADMIN_TOKEN:?Set ACCESS_GATEWAY_ADMIN_TOKEN}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
      - app

  web:
    image: ${WEB_IMAGE:?Set a web image digest}
    environment:
      ACCESS_GATEWAY_BASE_URL: http://gateway:8080
      ACCESS_GATEWAY_ADMIN_TOKEN: ${ACCESS_GATEWAY_ADMIN_TOKEN:?Set ACCESS_GATEWAY_ADMIN_TOKEN}
      ACCESS_WEB_PASSWORD_HASH: ${ACCESS_WEB_PASSWORD_HASH:?Set ACCESS_WEB_PASSWORD_HASH}
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      - gateway
    networks:
      - app

volumes:
  postgres_data:

networks:
  app:
  data:
    internal: true
